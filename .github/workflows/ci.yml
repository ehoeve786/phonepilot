name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, tests, module graph, all flavors
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # network/gonet builds its Go networking library with gomobile and the runner's Android NDK.
      - uses: actions/setup-go@v5
        with:
          go-version-file: network/gonet/go/go.mod
          cache-dependency-path: network/gonet/go/go.sum

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260908204917-8b95e45f8d3e
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260908204917-8b95e45f8d3e
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Go tests
        working-directory: network/gonet/go
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test ./...

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Module graph rules
        run: ./gradlew checkModuleGraph

      - name: Build logic tests
        run: ./gradlew -p build-logic :convention:test

      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew test 2>&1 | tee unit-tests.log

      - name: Surface unit test failures
        if: failure()
        run: |
          grep -E '^e: |FAILED|What went wrong|Exception' unit-tests.log | head -40 | while IFS= read -r line; do
            echo "::error title=Unit tests::${line//$'\r'/}"
          done
          for f in $(find . -path '*/build/test-results/*' -name '*.xml'); do
            grep -l '<failure' "$f" >/dev/null 2>&1 && grep -o '<failure message="[^"]*"' "$f" | head -3 | sed "s|^|$f: |" | while IFS= read -r line; do echo "::error title=Failed test::$line"; done
          done

      - name: Android lint
        run: ./gradlew :app:lintOssDebug

      - name: Assemble every flavor
        run: ./gradlew :app:assembleDebug

      - name: Upload the oss debug APK for on-device checks
        uses: actions/upload-artifact@v4
        with:
          name: pocketpilot-oss-debug
          path: app/build/outputs/apk/oss/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint and test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/

  # The latest green build of this repository's own branches, at a fixed link the phone can open:
  # https://github.com/<owner>/<repo>/releases/download/dev/pocketpilot-oss-debug.apk
  dev-release:
    name: Publish the dev build
    needs: build
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pocketpilot-oss-debug
          path: apk

      - name: Replace the dev release's APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REF: ${{ github.head_ref || github.ref_name }}
        run: |
          cp apk/*.apk pocketpilot-oss-debug.apk
          notes="Debug build of $REF at $SHA (CI run ${{ github.run_number }}). Signed with the public debug key; for testing only."
          if gh release view dev > /dev/null 2>&1; then
            gh release edit dev --prerelease --title "Dev build" --notes "$notes"
          else
            gh release create dev --prerelease --title "Dev build" --notes "$notes" --target "$SHA"
          fi
          gh release upload dev pocketpilot-oss-debug.apk --clobber
